apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file("$projectRoot/index.js")
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    cliFile = file("$projectRoot/scripts/native-cli.cjs")
    bundleCommand = "bundle"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Existing installations must keep their signer until a separately validated key migration.
def financeSigningMode = findProperty('financeSigningMode') ?: 'compatibility'
if (!(financeSigningMode in ['compatibility', 'production'])) {
    throw new GradleException('financeSigningMode must be compatibility or production')
}
def productionSigning = financeSigningMode == 'production'
def signingEnvironment = ['FINANCE_KEYSTORE_PATH', 'FINANCE_KEYSTORE_PASSWORD', 'FINANCE_KEY_ALIAS', 'FINANCE_KEY_PASSWORD']
if (productionSigning && signingEnvironment.any { !System.getenv(it) }) {
    throw new GradleException('Production signing requires FINANCE_KEYSTORE_PATH, FINANCE_KEYSTORE_PASSWORD, FINANCE_KEY_ALIAS and FINANCE_KEY_PASSWORD. See docs/SIGNING.md.')
}
if (productionSigning && !file(System.getenv('FINANCE_KEYSTORE_PATH')).isFile()) {
    throw new GradleException('The production keystore file does not exist.')
}
if (!productionSigning) logger.warn('COMPATIBILITY SIGNING: keeping the existing certificate for installed APK updates. This is not a production key migration.')

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.personal.flujofinanzas'
    defaultConfig {
        applicationId 'com.personal.flujofinanzas'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "1.27.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (productionSigning) {
            production {
                storeFile file(System.getenv('FINANCE_KEYSTORE_PATH'))
                storePassword System.getenv('FINANCE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FINANCE_KEY_ALIAS')
                keyPassword System.getenv('FINANCE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No silent fallback when production signing is explicitly requested.
            signingConfig productionSigning ? signingConfigs.production : signingConfigs.debug
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation("androidx.biometric:biometric:1.1.0")
    // OkHttp from React Native otherwise selects Okio 2.9 (CVE-2023-3635).
    // Okio 3 preserves its JVM API; the compatibility test below exercises that path.
    implementation("com.squareup.okio:okio:3.4.0")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")
    // Patched test-only provider; never added to the release APK or Gradle tooling.
    testImplementation("org.bouncycastle:bcprov-jdk18on:1.85")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Export what Gradle actually resolves, not only the direct declarations.
tasks.register('writeNativeDependencyInventory') {
    def inventory = layout.buildDirectory.file('reports/dependencies/native-inventory.json')
    outputs.file(inventory)
    outputs.upToDateWhen { false }
    doLast {
        def scopes = [release: configurations.releaseRuntimeClasspath,
                      tests: configurations.releaseUnitTestRuntimeClasspath,
                      tooling: rootProject.buildscript.configurations.classpath]
        def components = scopes.collectMany { scope, configuration ->
            configuration.incoming.resolutionResult.allComponents.collect { component ->
                def id = component.id
                if (!(id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) return null
                [scope: scope, name: "${id.group}:${id.module}".toString(), version: id.version]
            }.findAll { it != null }
        }.unique().sort { "${it.scope}:${it.name}" }
        def output = inventory.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            schemaVersion: 1, components: components
        ])) + '\n'
        println("Native dependency inventory: ${output} (${components.size()} resolved components)")
    }
}
